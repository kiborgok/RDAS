apiVersion: v1
kind: ConfigMap
metadata:
  name: rdas-config
  namespace: rdas
  labels:
    app.kubernetes.io/name: rdas
data:
  # Externalised, non-secret configuration. Override per environment.
  # SPRING_APPLICATION_JSON is the simplest way to inject nested config.
  SPRING_APPLICATION_JSON: |
    {
      "rdas": {
        "soap": {
          "endpoint": "http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso",
          "namespace": "http://www.oorsprong.org/websamples.countryinfo",
          "connect-timeout-ms": 5000,
          "read-timeout-ms": 15000
        },
        "cache": {
          "refresh-interval": "PT6H",
          "initial-load-on-startup": true,
          "serve-stale-on-failure": true
        },
        "query": {
          "default-page-size": 20,
          "max-page-size": 100
        }
      }
    }
