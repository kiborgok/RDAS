apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdas
  namespace: rdas
  labels:
    app.kubernetes.io/name: rdas
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rdas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rdas
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rdas
          # Replace with your registry, e.g. ghcr.io/<org>/rdas:1.0.0
          image: rdas:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: rdas-config
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Startup probe gives the app time to boot AND warm the cache from SOAP
          # before liveness/readiness begin. Up to 60s (12 x 5s).
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 12
            periodSeconds: 5
          # Liveness: restart only if the process is wedged (not on SOAP outage).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          # Readiness: remove from Service endpoints if reference data unavailable.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Let in-flight requests drain before SIGTERM (graceful shutdown).
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
